# Publishes website/ to GitHub Pages (https://diskgarden.app). The app's update feed is website/appcast.xml (copied
# here by the app repo's scripts/publish-update.sh), served at https://diskgarden.app/appcast.xml. See docs/WEBSITE.md.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: the script's f-strings and the runner's default python3 have drifted apart before (DIS-18),
      # and the ubuntu-latest label moves to Ubuntu 26 from 2026-10-19.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bake shared parts (head, header, footer, release facts, sitemap)
        run: python3 scripts/build-website.py
      # After the build, not before: the 17 translated page sets only exist once build-website.py has
      # written them, and they carry most of the download links. Before "Assemble the site", so a label that
      # has drifted out of the Worker's vocabulary fails the run instead of deploying downloads credited to
      # nobody. See "Download attribution" in docs/WEBSITE.md.
      - name: Check the ?src= download-attribution tags
        run: python3 scripts/check-src-tags.py
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R website/. _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Minify scripts (the repo keeps the readable sources)
        run: npx --yes esbuild@0.24 _site/assets/site.js _site/assets/bloom.js --minify --outdir=_site/assets --allow-overwrite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
